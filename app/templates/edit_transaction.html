{% extends "base.html" %}

{% block content %}
<h2>Edit Transaction</h2>
<form method="POST">
    <label for="amount">Amount:</label>
    <input type="number" name="amount" step="0.01" value="{{ transaction.amount }}" required><br>

    <label for="category">Category:</label>
    <input type="text" name="category" value="{{ transaction.category }}" required><br>

    <button type="submit">Update</button>
    <a href="{{ url_for('main.dashboard') }}">
        <button type="button">Cancel</button>
    </a>
</form>
{% endblock %}
