name: Create Alerts
on: [push]

jobs:
  setup-alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDS }}

      - name: Get WebApp ID
        id: webapp
        run: |
          ID=$(az webapp show --name budgetbuddy-prod --resource-group myRG --query id -o tsv)
          echo "::set-output name=WEBAPP_ID::$ID"

      - name: Create CPU Alert
        run: |
          az monitor metrics alert create \
            --name "HighCPU-BudgetBuddy" \
            --resource-group myRG \
            --scopes ${{ steps.webapp.outputs.WEBAPP_ID }} \
            --condition "avg Percentage CPU > 80 for 5 minutes" \
            --action email your-email@example.com