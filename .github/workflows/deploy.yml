name: CD Pipeline
on:
  push:
    branches: [ "main" ]  
  pull_request:
    branches: [ "c_deployment" ]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: pytest tests/              
      - uses: anchore/sbom-action@v1    
      - name: Build Docker image
        run: docker build -t budgetbuddy:${{ github.sha }} .

  deploy-staging:
    needs: build-test-scan
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDS }}
      - run: az webapp up --name budgetbuddy-staging --resource-group myRG

  deploy-prod:
    needs: build-test-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDS }}
      - run: az webapp up --name budgetbuddy-prod --resource-group myRG