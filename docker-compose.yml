version: "3.9"

services:
  budgetbuddy:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: budgetbuddy-app
    ports:
      - "5000:5000"
    volumes:
      # Persist SQLite database
      - budgetbuddy_data:/app/data
      # Mount database file to host for backup/access
      - ./budgetbuddy.db:/app/budgetbuddy.db
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - budgetbuddy-network

  # Optional: Add nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: budgetbuddy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - budgetbuddy
    restart: unless-stopped
    networks:
      - budgetbuddy-network
    profiles:
      - production

volumes:
  budgetbuddy_data:
    driver: local

networks:
  budgetbuddy-network:
    driver: bridge

